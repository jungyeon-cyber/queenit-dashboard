name: daily-update

on:
  schedule:
    - cron: '15 0 * * *'   # KST 09:15 (main)
    - cron: '30 0 * * *'   # KST 09:30 (backup)
  workflow_dispatch:

jobs:
  crawl:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Seoul
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 패키지 설치
        run: pip install requests beautifulsoup4 lxml
      - name: 크롤러 실행
        run: python crawler.py
      - name: 결과 커밋
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add reports/ data/
          git diff --staged --quiet || git commit -m "daily update $(TZ=Asia/Seoul date +'%Y-%m-%d %H:%M KST')"
          git push
